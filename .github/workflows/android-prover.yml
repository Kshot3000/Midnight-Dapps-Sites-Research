name: Android prover app checks

on:
  pull_request:
    paths:
      - 'apps/android-prover/**'
      - '.github/workflows/android-prover.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android-prover/**'
      - '.github/workflows/android-prover.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-prover
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test, render native previews and assemble the debug APK
        env:
          PROVER_SCREENSHOT_DIR: ${{ runner.temp }}/android-prover-screenshots
        run: |
          mkdir -p "$PROVER_SCREENSHOT_DIR"
          gradle testDebugUnitTest assembleDebug --console=plain -Proborazzi.test.record=true
      - uses: actions/upload-artifact@v4
        with:
          name: midnight-prover-debug-apk
          path: apps/android-prover/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: midnight-prover-screenshots
          path: ${{ runner.temp }}/android-prover-screenshots
          if-no-files-found: error
