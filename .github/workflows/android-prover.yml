name: Android prover app checks

on:
  pull_request:
    paths:
      - 'apps/android-prover/**'
      - '.github/workflows/android-prover.yml'
  push:
    branches: [main]
    paths:
      - 'apps/android-prover/**'
      - '.github/workflows/android-prover.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-prover
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle testDebugUnitTest assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: midnight-prover-debug-apk
          path: apps/android-prover/app/build/outputs/apk/debug/app-debug.apk
