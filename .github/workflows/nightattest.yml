name: NightAttest contract checks

on:
  pull_request:
    paths:
      - 'apps/nightattest/**'
      - '.github/workflows/nightattest.yml'
  push:
    branches: [main]
    paths:
      - 'apps/nightattest/**'
      - '.github/workflows/nightattest.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nightattest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8 # v1
        with:
          compact-version: '0.36.1'
      - run: npm ci
      - run: npm run compile
      - run: npm test
